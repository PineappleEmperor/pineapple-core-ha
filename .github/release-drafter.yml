name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Sole labeler keyed on the PR TITLE only — a human writes that title, so it must use
# a mapped type or the PR gets no label and no release category. Mapped: feat|feature,
# fix, and chore|docs|refactor|perf|test|build|ci|style (all -> chore); any `type!:` ->
# xfeat. NOT mapped: `revert:`, which lint_pr accepts — the title-check job in pr-checks.yml flags it. No branch rules (they flapped when the branch name disagreed with
# the commits). Breaking `!` must precede `feature`.
autolabeler:
  - label: "xfeat"
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: "chore"
    title:
      - '/^(chore|docs|refactor|perf|test|build|ci|style)(\(.+\))?:/i'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?:/i'
  - label: "feature"
    title:
      - '/^(feat|feature)(\(.+\))?:/i'
categories:
  - title: '🚨 Breaking Change'
    labels: ['xfeat', 'xfeature', 'major']
  - title: '🚀 Features'
    labels: ['feat', 'feature', 'enhancement']
  - title: '🔧 Fixes'
    labels: ['fix', 'bugfix', 'bug']
  - title: '🧰 Maintenance'
    label: 'chore'
change-template: |-
  - $TITLE @$AUTHOR (#$NUMBER)
  $BODY
change-title-escapes: '\<*_&'
# $BODY is global (no per-category change-template). Bounded replacers (no end-anchor,
# so they can't bleed across concatenated PR bodies) scrub Dependabot fluff while
# keeping human PRs' grouped mini-changelog.
replacers:
  - search: '/<details>[\s\S]*?<\/details>\s*/g'
    replace: ''
  - search: '/\[!\[Dependabot compatibility score\][^\n]*\n?/g'
    replace: ''
  - search: '/Dependabot will resolve[^\n]*\n?/g'
    replace: ''
  - search: '/\[\/\/\]: # \(dependabot-start\)[\s\S]*?\[\/\/\]: # \(dependabot-end\)\s*/g'
    replace: ''
  - search: '/<br\s*\/?>\s*/g'
    replace: ''
  - search: '/<!-- commit-summary:(start|end) -->\n?/g'   # markers are plumbing, not notes
    replace: ''
version-resolver:
  major:
    labels: ['major', 'xfeature', 'xfeat']
  minor:
    labels: ['feat', 'feature', 'minor']
  patch:
    labels: ['patch', 'fix', 'chore', 'bugfix', 'bug']
  default: patch
template: |
  ## Changes

  $CHANGES
