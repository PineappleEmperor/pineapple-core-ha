[project]
name = "pineapple-core-ha"
version = "0.1.0"
description = "Home Assistant integration that delivers Pineapple Core reminders locally."
readme = "README.md"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "COM812",  # handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "ANN", "D", "INP001", "PLR2004"]
"scripts/*" = ["T20", "INP001"]

[tool.pylint.main]
py-version = "3.14"

[tool.pyright]
typeCheckingMode = "standard"
