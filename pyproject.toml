[project]
name = "pineapple-core-ha"
version = "0.1.0"
description = "Home Assistant integration that delivers Pineapple Core reminders locally."
readme = "README.md"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "COM812",  # handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",    # asserts are the point of a test
  "S105",    # S106 — hardcoded fixture tokens, not real secrets
  "S106",
  "SLF001",  # tests legitimately read private members (HA core does the same)
  "ANN",     # annotations optional in tests
  "D",       # docstring rules relaxed for tests
  "INP001",  # tests/ is not an importable package
  "PLR2004", # magic values are fine in assertions
  "PT018",   # composite asserts read fine in tests
  "ARG001",  # pytest fixtures are injected by name, not always used
  "EM101",   # EM102/TRY003 — inline messages fine in test helpers
  "TRY003",
  "TC001",   # TC002/TC003 — keep test imports at module top, not in TYPE_CHECKING
  "TC002",
  "TC003",
]
"scripts/*" = ["T20", "INP001", "D", "TRY003", "EM101", "EM102", "PLR0911", "E501", "S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.14"
